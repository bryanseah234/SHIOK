[project]
name = "shiok"
version = "0.1.0"
description = "S.H.I.O.K. Index — Singapore walk-to-transit comfort index"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "black>=24.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.2",
    "pytest>=8.0.2",
    "ruff>=0.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
