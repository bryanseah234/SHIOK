# S.H.I.O.K. Index pipeline parameters (PRD v4.2 §7, §15)
shelter_lambda: 2.0
detour_budget: 1.25
origin_reachable_component_resnap_max_m: 50
transit_access:
  full_credit_m: 400
  linear_floor_m: 800
  score_at_800m: 40
  zero_credit_m: 1200
  bus_interchange_full_credit_m: 200
bus_connectivity:
  routed_max_m: 250
  straight_line_candidate_m: 300
  straight_line_candidate_tolerance_m: 5
  access_connector_search_m: 50
  access_connector_max_candidates: 24
  access_connector_max_walk_m: 300
  access_connector_max_direct_ratio: 2.5
  access_connector_max_extra_m: 100
  direct_fallback_detour_ratio: 3.0
  direct_fallback_min_extra_m: 100
  direct_fallback_shortcut_ratio: 0.5
  direct_fallback_min_missing_m: 50
  road_centerline_guard_min_m: 50
  road_centerline_guard_min_ratio: 0.5
  road_centerline_guard_max_pedestrian_m: 25
  endpoint_snap_guard_min_m: 25
  endpoint_snap_guard_min_ratio: 0.6
  access_connector_trust_max_m: 40
  access_connector_trust_min_ratio: 0.2
  full_credit_wait_min: 2
  zero_credit_wait_min: 15
crossing_friction:
  dbscan_eps_m: 20
  dbscan_min_samples: 2
  penalty_per_crossing: 20
heat_comfort:
  shade_proxy_weight: 0.5
onemap:
  highest_sustained_clean_rate_rps: 1.0  # Empirical ladder probe R (citation: logs/onemap_probe.csv)
  derived_client_throttle_rps: 0.5       # R / 2 per Section B formula
  client_delay_sec: 2.0                   # 1.0 / 0.5 = 2.0s delay between requests
  server_proxy_throttle_per_min: 30
