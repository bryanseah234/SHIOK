# S.H.I.O.K. Index pipeline parameters (PRD v4.2 §7, §15)
shelter_lambda: 2.0
detour_budget: 1.25
origin_reachable_component_resnap_max_m: 50
transit_access:
  full_credit_m: 400
  linear_floor_m: 800
  score_at_800m: 40
  zero_credit_m: 1200
  bus_interchange_full_credit_m: 200
  access_connector_search_m: 50
  access_connector_max_candidates: 24
  access_connector_max_walk_m: 1200
  access_connector_max_direct_ratio: 2.5
  access_connector_max_extra_m: 120
  access_connector_detour_ratio: 2.0
  access_connector_min_extra_m: 100
  access_connector_scale_min_extra_to_direct: true
bus_connectivity:
  routed_max_m: 250
  straight_line_candidate_m: 300
  straight_line_candidate_tolerance_m: 5
  access_connector_search_m: 50
  access_connector_max_candidates: 24
  access_connector_max_walk_m: 300
  access_connector_max_direct_ratio: 2.5
  access_connector_max_extra_m: 100
  direct_fallback_detour_ratio: 3.0
  direct_fallback_near_stop_detour_ratio: 2.0
  direct_fallback_min_extra_m: 100
  direct_fallback_scale_min_extra_to_direct: true
  direct_fallback_shortcut_ratio: 0.5
  direct_fallback_min_missing_m: 50
  road_centerline_guard_min_m: 50
  road_centerline_guard_min_ratio: 0.5
  road_centerline_guard_max_pedestrian_m: 25
  endpoint_snap_guard_min_m: 25
  endpoint_snap_guard_min_ratio: 0.6
  combined_connector_guard_min_m: 50
  combined_connector_guard_min_ratio: 0.5
  access_connector_trust_max_m: 40
  access_connector_trust_min_ratio: 0.2
  access_connector_near_stop_direct_m: 60
  access_connector_near_stop_max_walk_m: 125
  access_connector_near_stop_max_extra_m: 75
  access_connector_near_stop_trust_max_m: 50
  access_connector_short_walk_direct_m: 250
  access_connector_short_walk_max_walk_m: 250
  access_connector_short_walk_max_extra_m: 60
  access_connector_short_walk_trust_max_m: 50
  full_credit_wait_min: 2
  zero_credit_wait_min: 15
crossing_friction:
  dbscan_eps_m: 20
  dbscan_min_samples: 2
  penalty_per_crossing: 20
heat_comfort:
  shade_proxy_weight: 0.5
onemap:
  highest_sustained_clean_rate_rps: 1.0  # Empirical ladder probe R (citation: logs/onemap_probe.csv)
  derived_client_throttle_rps: 0.5       # R / 2 per Section B formula
  client_delay_sec: 2.0                   # 1.0 / 0.5 = 2.0s delay between requests
  server_proxy_throttle_per_min: 30
onemap_walk_validation:
  # OneMap walk-routing gate thresholds. Rationale in qa/bus_median_gap_diagnosis_20260804.md:
  # OSM+/OneMap independent pedestrian graphs have a ~11% structural median delta noise floor;
  # ~48/1611 postals are OneMap-impossible (walk < crow-flies), ~80/1611 are project snap-bugs
  # (project_shortest_m < direct_distance_m). Neither is fixable inside this project.
  median_abs_pct_delta_max: 12.0
  p95_abs_pct_delta_max: 100.0
  # When true, the gate-decision median/p95 are computed over the plausible subset only
  # (distance_sanity == "plausible" AND project_shortest_m >= direct_distance_m * ratio).
  # Full unfiltered stats still appear in the report; only gate_passed uses the filter.
  require_distance_sanity_plausible: true
  project_snap_bug_ratio: 0.98
